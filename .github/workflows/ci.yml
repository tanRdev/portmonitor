name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test --build-path /tmp/portmonitor-spm --disable-experimental-prebuilts -j 2

      - name: Build app bundle
        run: ./scripts/build.sh

      - name: Build DMG
        run: ./scripts/create-dmg.sh

      - name: Upload app bundle as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PortMonitor-app
          path: build/PortMonitor.app
          retention-days: 14

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PortMonitor-dmg
          path: build/PortMonitor.dmg
          retention-days: 14
